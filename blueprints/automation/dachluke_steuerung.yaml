                    {% else %}
                    {{ current_humidity | round(0) }}% rH –
                    unter Schließschwelle {{ close_threshold | round(0) }}%.
                    {% endif %}
          - if:
              - condition: template
                value_template: "{{ notify_persistent_enabled }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: dachluke_bad
                  title: "✅ Dachluke geschlossen"
                  message: >
                    {% if indoor_dew_point_available %}
                    Taupunkt innen {{ indoor_dew_point | round(1) }}°C /
                    außen {{ outdoor_dew_point | round(1) }}°C.
                    {% else %}
                    Lüftung abgeschlossen –
                    {{ current_humidity | round(0) }}% rH.
                    {% endif %}
              - action: input_text.set_value
                target:
                  entity_id: !input status_helper
                data:
                  value: >
                    {{ now().strftime('%d.%m. %H:%M') }} –
                    ✅ Geschlossen,
                    {% if indoor_dew_point_available %}
                    TP {{ indoor_dew_point | round(1) }}°C
                    {% else %}
                    {{ current_humidity | round(0) }}% rH
                    {% endif %}
          - if:
              - condition: template
                value_template: "{{ alexa_all }}"
            then:
              - action: notify.send_message
                data:
                  message: >
                    <prosody volume='{{ notify_alexa_volume }}'>
                    Lüftung abgeschlossen. Dachluke geschlossen.
                    </prosody>
                target:
                  entity_id: "{{ notify_alexa_entity }}"

      # ════════════════════════════════════════════════════════════════════════
      # PRIORITÄT 8: PLAUSIBILITÄT
      # ════════════════════════════════════════════════════════════════════════

      # ── PLAUSIBILITÄT: Kontaktsensor vs. Positionssensor ─────────────────
      # [FIX 0.7.5] Nicht sofort vergleichen: Position und Kontakt melden nach
      # Fahrbewegungen oft zeitversetzt. Erst nach kurzer Stabilisierungszeit
      # frische Zustände lesen und dann bewerten.
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id in ['position_changed', 'contact_changed']
                 and contact_sensor_enabled
                 and contact_sensor not in ['', none] }}
        sequence:
          - delay:
              seconds: "{{ mismatch_grace_seconds | int }}"
          - variables:
              fresh_position_available: >
                {{ states(position_sensor) not in ['unavailable', 'unknown', 'none', '']
                   and is_number(states(position_sensor)) }}
              fresh_contact_available: >
                {{ states(contact_sensor) not in ['unavailable', 'unknown', 'none', ''] }}
              fresh_current_position: >
                {{ states(position_sensor) | float(0) if fresh_position_available else 0 }}
              fresh_sensor_open: >
                {{ fresh_position_available and (fresh_current_position | float(0)) > 0 }}
              fresh_contact_open: >
                {{ states(contact_sensor) == 'on' }}
              fresh_contact_mismatch: >
                {{ fresh_position_available
                   and fresh_contact_available
                   and (fresh_sensor_open != fresh_contact_open) }}
          - condition: template
            value_template: "{{ fresh_contact_mismatch }}"
          - if:
              - condition: template
                value_template: "{{ notify_app_enabled }}"
            then:
              - action: "{{ notify_app_service }}"
                data:
                  title: "⚠️ Dachluke Sensor-Widerspruch"
                  message: >
                    Positionssensor meldet
                    {% if fresh_sensor_open %}offen{% else %}geschlossen{% endif %}
                    ({{ fresh_current_position | round(0) }}%), Kontaktsensor meldet
                    {% if fresh_contact_open %}offen
                    {% else %}geschlossen{% endif %}. Bitte prüfen!
          - if:
              - condition: template
                value_template: "{{ notify_persistent_enabled }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: dachluke_bad_fehler
                  title: "⚠️ Dachluke Sensor-Widerspruch"
                  message: >
                    Positionssensor {{ fresh_current_position | round(0) }}% vs.
                    Kontaktsensor {{ states(contact_sensor) }} – bitte prüfen.
              - action: input_text.set_value
                target:
                  entity_id: !input status_helper
                data:
                  value: >
                    {{ now().strftime('%d.%m. %H:%M') }} –
                    ⚠️ Sensor-Widerspruch Dachluke
          - if:
              - condition: template
                value_template: "{{ alexa_critical }}"
            then:
              - action: notify.send_message
                data:
                  message: >
                    <prosody volume='{{ notify_alexa_volume }}'>
                    Achtung. Dachluke Sensorfehler.
                    </prosody>
                target:
                  entity_id: "{{ notify_alexa_entity }}"

mode: queued
max: 3
max_exceeded: silent
